<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">

<defs>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0D1117"/>
<stop offset="100%" stop-color="#111827"/>
</linearGradient>

<linearGradient id="grad">
<stop offset="0%" stop-color="#22D3EE">
<animate attributeName="stop-color"
values="#22D3EE;#58A6FF;#7C3AED;#22D3EE"
dur="8s"
repeatCount="indefinite"/>
</stop>

<stop offset="100%" stop-color="#7C3AED"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="6" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<rect width="1600" height="500" fill="url(#bg)"/>

<!-- Grid -->

<g opacity=".12">

<path d="M0 100H1600"/>
<path d="M0 200H1600"/>
<path d="M0 300H1600"/>
<path d="M0 400H1600"/>

<path d="M200 0V500"/>
<path d="M400 0V500"/>
<path d="M600 0V500"/>
<path d="M800 0V500"/>
<path d="M1000 0V500"/>
<path d="M1200 0V500"/>
<path d="M1400 0V500"/>

</g>

<!-- Animated particles -->

<circle cx="180" cy="100" r="5" fill="#22D3EE">
<animate attributeName="cy" values="100;80;100" dur="5s" repeatCount="indefinite"/>
</circle>

<circle cx="1200" cy="380" r="4" fill="#7C3AED">
<animate attributeName="cy" values="380;340;380" dur="7s" repeatCount="indefinite"/>
</circle>

<circle cx="1450" cy="120" r="6" fill="#58A6FF">
<animate attributeName="cy" values="120;90;120" dur="6s" repeatCount="indefinite"/>
</circle>

<!-- Decorative lines -->

<line x1="120" y1="250" x2="520" y2="250"
stroke="url(#grad)"
stroke-width="3"/>

<line x1="1080" y1="250" x2="1480" y2="250"
stroke="url(#grad)"
stroke-width="3"/>

<!-- Main Title -->

<text
x="800"
y="180"
text-anchor="middle"
font-size="86"
font-family="JetBrains Mono"
font-weight="700"
fill="url(#grad)"
filter="url(#glow)">

MY STASH

<animate
attributeName="opacity"
values=".7;1;.7"
dur="2.5s"
repeatCount="indefinite"/>

</text>

<!-- Subtitle -->

<text
x="800"
y="245"
text-anchor="middle"
font-size="30"
font-family="JetBrains Mono"
fill="#E5E7EB">

Artificial Intelligence • Machine Learning • Developer

</text>

<!-- Name -->

<text
x="800"
y="315"
text-anchor="middle"
font-size="42"
font-family="JetBrains Mono"
fill="#58A6FF">

ARSHAD

</text>

<!-- Motto -->

<text
x="800"
y="370"
text-anchor="middle"
font-size="24"
font-family="JetBrains Mono"
fill="#9CA3AF">

Learn • Code • Build • Repeat

</text>

<!-- Bottom line -->

<line
x1="450"
y1="420"
x2="1150"
y2="420"
stroke="url(#grad)"
stroke-width="3">

<animate
attributeName="stroke-dasharray"
values="0,800;800,0;0,800"
dur="8s"
repeatCount="indefinite"/>

</line>

</svg>