<svg width="1200" height="40" viewBox="0 0 1200 40" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#22D3EE">
<animate attributeName="stop-color"
values="#22D3EE;#58A6FF;#7C3AED;#22D3EE"
dur="6s"
repeatCount="indefinite"/>
</stop>

<stop offset="100%" stop-color="#7C3AED"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="2" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<!-- Main Line -->
<line
x1="60"
y1="20"
x2="1140"
y2="20"
stroke="url(#grad)"
stroke-width="3"
stroke-linecap="round"
filter="url(#glow)"/>

<!-- Left Circle -->
<circle cx="60" cy="20" r="6" fill="#22D3EE">
<animate attributeName="r"
values="5;8;5"
dur="2s"
repeatCount="indefinite"/>
</circle>

<!-- Center Diamond -->
<polygon
points="600,10 610,20 600,30 590,20"
fill="#58A6FF"
filter="url(#glow)">
<animateTransform
attributeName="transform"
type="rotate"
from="0 600 20"
to="360 600 20"
dur="12s"
repeatCount="indefinite"/>
</polygon>

<!-- Right Circle -->
<circle cx="1140" cy="20" r="6" fill="#7C3AED">
<animate attributeName="r"
values="5;8;5"
dur="2s"
repeatCount="indefinite"/>
</circle>

<!-- Moving Glow -->
<circle cx="60" cy="20" r="4" fill="#FFFFFF" opacity="0.9">
<animateMotion
dur="4s"
repeatCount="indefinite"
path="M0,0 L1080,0"/>
</circle>

</svg>