<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="grad">
<stop offset="0%" stop-color="#22D3EE"/>
<stop offset="100%" stop-color="#7C3AED"/>
</linearGradient>

</defs>

<rect width="900" height="120" rx="20" fill="#0D1117"/>

<text
x="40"
y="45"
fill="#58A6FF"
font-size="24"
font-family="JetBrains Mono">

INITIALIZING MY STASH...

</text>

<rect
x="40"
y="65"
width="820"
height="18"
rx="9"
fill="#1F2937"/>

<rect
x="40"
y="65"
width="0"
height="18"
rx="9"
fill="url(#grad)">

<animate
attributeName="width"
values="0;820;0"
dur="4s"
repeatCount="indefinite"/>

</rect>

<text
x="820"
y="45"
fill="#FFFFFF"
font-size="18"
font-family="JetBrains Mono">

100%

<animate
attributeName="opacity"
values="0.4;1;0.4"
dur="1.2s"
repeatCount="indefinite"/>

</text>

</svg>