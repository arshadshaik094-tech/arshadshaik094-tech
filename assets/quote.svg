<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#22D3EE"/>
<stop offset="100%" stop-color="#7C3AED"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="4" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<rect
width="900"
height="220"
rx="25"
fill="#0D1117"/>

<rect
x="4"
y="4"
width="892"
height="212"
rx="22"
fill="none"
stroke="url(#g)"
stroke-width="2"/>

<text
x="450"
y="70"
text-anchor="middle"
font-family="JetBrains Mono"
font-size="32"
fill="url(#g)"
filter="url(#glow)">

"Learn. Code. Build. Repeat."

</text>

<text
x="450"
y="115"
text-anchor="middle"
font-family="JetBrains Mono"
font-size="18"
fill="#9CA3AF">

Every expert was once a beginner.

</text>

<line
x1="180"
y1="155"
x2="720"
y2="155"
stroke="url(#g)"
stroke-width="2">

<animate
attributeName="stroke-dasharray"
values="0,600;600,0;0,600"
dur="6s"
repeatCount="indefinite"/>

</line>

<text
x="450"
y="190"
text-anchor="middle"
font-family="JetBrains Mono"
font-size="16"
fill="#58A6FF">

MY STASH • AI • ML • DEVELOPMENT

</text>

</svg>